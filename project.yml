name: HermesVoice
configs:
  Debug: debug
  Release: release
  PhonePreview: release
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
  PhonePreview: Local.xcconfig
options:
  bundleIdPrefix: com.perryraskin
  deploymentTarget:
    iOS: '26.4'
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '1'
    DEVELOPMENT_TEAM: "$(HERMES_DEVELOPMENT_TEAM)"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.9.0
targets:
  HermesVoice:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - package: LiveKit
      - target: HermesVoiceLiveActivity
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hermes
        NSSupportsLiveActivities: true
        HermesPrivateHost: $(HERMES_PRIVATE_HOST)
        CFBundleURLTypes:
          - CFBundleURLName: com.perryraskin.hermes.voice.pair
            CFBundleURLSchemes: [hermesvoice]
        NSLocalNetworkUsageDescription: Hermes connects privately to your Mac over Tailscale for voice conversations and call settings.
        NSMicrophoneUsageDescription: Hermes uses your microphone during conversations you start.
        UIBackgroundModes: [audio, voip]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlayScene
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERMES_APP"
        CODE_SIGN_ENTITLEMENTS: CarPlay.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.perryraskin.hermes.voice
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hermes
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hermes uses your microphone during conversations you start.
        INFOPLIST_KEY_UIBackgroundModes: [audio, voip]
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Preserve the explicit CarPlay scene; auto-generation replaces its configurations with an empty dictionary.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: '1'
      configs:
        PhonePreview:
          CODE_SIGN_ENTITLEMENTS: Phone.entitlements
  HermesVoiceLiveActivity:
    type: app-extension
    platform: iOS
    sources: [WidgetExtension, Shared]
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryraskin.hermes.voice.liveactivity
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HERMES_WIDGET"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: '1'
  HermesVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HermesVoice
